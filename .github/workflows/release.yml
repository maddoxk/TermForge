name: Release to PyPI

# Runs only when a version tag is pushed. Never on pull requests or branch pushes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          pkg_version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('termforge/__init__.py').read()).group(1))")
          if [ "${GITHUB_REF_NAME}" != "v${pkg_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match termforge.__version__ ${pkg_version}" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - name: Test the built wheel in a clean venv
        run: scripts/check_installed_wheel.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The `pypi` environment must exist in the repo settings (see RELEASING.md).
    # Add required reviewers there to get a manual approval gate before upload.
    environment:
      name: pypi
      url: https://pypi.org/project/termforge/
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
