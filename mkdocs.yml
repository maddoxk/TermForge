site_name: TermForge
site_description: A universal terminal UI/UX design system for Python
site_url: https://maddoxk.github.io/TermForge/
repo_url: https://github.com/maddoxk/TermForge
repo_name: maddoxk/TermForge
docs_dir: docs
site_dir: docs-site

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - Components:
    - Overview: components/index.md
    - Display: components/display.md
    - Input: components/input.md
    - Layout: components/layout.md
    - Charts: components/charts.md
  - Themes: themes.md
  - API Reference: api.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
